# Tool configuration only. This project is a set of scripts, not an installable
# package, so there is deliberately no [project] or [build-system] table and
# nothing here needs to be installed to reproduce the study.
#
# Ruff is an optional developer tool. It is not in requirements.txt because the
# study does not need it:  uvx ruff check .   or   pip install ruff && ruff check .

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data", "results/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # `predict = lambda x: ...` keeps the two model families behind one call
    # signature; naming the closures would not make the intent clearer.
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["analyze", "evaluation", "experiments", "features", "models", "prepare_day", "protocol", "summarize_results"]

[tool.ruff.lint.per-file-ignores]
# These three build the report, the README and the video plan. Their long lines
# are literal prose sentences inside f-strings, where a wrap would put a line
# break into the rendered document.
"create_report.py" = ["E501"]
"write_readme.py" = ["E501"]
"prepare_submission.py" = ["E501"]
